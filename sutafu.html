<!DOCTYPE html>
<html lang="ja"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運転士用スタフ（行路表）エディタ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    /* 印刷時はツールバー等を隠す */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        padding: 0 !important;
      }
      #app-container {
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
    }

    /* フルスクリーン表示時のスタイル */
    :fullscreen #app-container,
    :-webkit-full-screen #app-container {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      display: flex;
      flex-direction: column;
    }
    :fullscreen #staff-sheet,
    :-webkit-full-screen #staff-sheet {
      flex: 1;
      overflow-y: auto;
    }

    /* 編集可能エリアのホバー・フォーカス演出 */
    [contenteditable="true"] {
      outline: none;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
      cursor: text;
    }
    .edit-mode [contenteditable="true"]:hover {
      background-color: rgba(59, 130, 246, 0.12);
    }
    [contenteditable="true"]:focus {
      background-color: rgba(59, 130, 246, 0.2) !important;
      box-shadow: inset 0 0 0 2px #3b82f6;
    }

    /* ダークモード（反転表示）用のスタイル */
    .dark-theme {
      background-color: #111827;
      color: #f9fafb;
    }
    .dark-theme #staff-sheet {
      background-color: #000000;
      color: #ffffff;
      border-color: #6b7280;
    }
    .dark-theme .border-line {
      border-color: #6b7280 !important;
    }
    .dark-theme .bg-header-bar {
      background-color: #1f2937 !important;
      color: #f3f4f6 !important;
    }
    .dark-theme .bg-sub-gray {
      background-color: #374151 !important;
      color: #f9fafb !important;
    }
    .dark-theme .bg-article-header {
      background-color: #4b5563 !important;
      color: #ffffff !important;
    }
    .dark-theme .train-type-box {
      background-color: #ffffff !important;
      color: #000000 !important;
    }
    .dark-theme clock-face {
      filter: invert(1);
    }
  </style>

  <script>
    // 初期データ（すべて白紙・空状態）
    function createEmptyRows(count = 16) {
      return Array.from({ length: count }, () => ({
        station: "",
        arrHm: "",
        arrSec: "",
        arrHighlight: false,
        mark: "",
        depHm: "",
        depSec: "",
        depHighlight: false
      }));
    }

    const DEFAULT_DATA = {
      navBackText: "メニュー",
      depotName: "",
      trainType: "",
      trainTypeColor: "bg-black text-white",
      carType: "",
      carCount: "",
      originStation: "",
      destStation: "",
      trainNumber: "",
      dutyStatus: "",
      clockTime: "00 : 00 : 00",
      remarks: "",
      sideNote: "",
      fontScale: 1.0,
      rows: createEmptyRows(16)
    };

    let currentData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    let clockInterval = null;
    let viewMode = 'edit'; // 'edit' | 'view'

    // 初期化処理
    window.addEventListener('DOMContentLoaded', () => {
      initAnalogClockFace();
      renderData(currentData);
      switchViewMode('edit', true);

      // フルスクリーン状態変化の監視
      document.addEventListener('fullscreenchange', updateFullScreenUI);
      document.addEventListener('webkitfullscreenchange', updateFullScreenUI);

      // メニュー外クリックでドロップダウンを閉じる
      document.addEventListener('click', (e) => {
        const leftMenu = document.getElementById('left-dropdown-menu');
        const rightMenu = document.getElementById('clock-menu');
        if (leftMenu && !leftMenu.classList.contains('hidden')) {
          closeLeftMenu();
        }
        if (rightMenu && !rightMenu.classList.contains('hidden')) {
          closeClockMenu();
        }
      });
    });

    // 左上「＜ メニュー」ドロップダウン制御
    function toggleLeftMenu(e) {
      if (e) e.stopPropagation();
      closeClockMenu();
      const menu = document.getElementById('left-dropdown-menu');
      if (menu) menu.classList.toggle('hidden');
    }

    function closeLeftMenu() {
      const menu = document.getElementById('left-dropdown-menu');
      if (menu) menu.classList.add('hidden');
    }

    // 右上「⋮」メニュー制御
    function toggleClockMenu(e) {
      if (e) e.stopPropagation();
      closeLeftMenu();
      const menu = document.getElementById('clock-menu');
      if (menu) menu.classList.toggle('hidden');
    }

    function closeClockMenu() {
      const menu = document.getElementById('clock-menu');
      if (menu) menu.classList.add('hidden');
    }

    // アナログ時計の文字盤（目盛り・数字）を生成
    function initAnalogClockFace() {
      const ticksGroup = document.getElementById('clock-ticks');
      if (!ticksGroup || ticksGroup.children.length > 0) return;

      const ns = "http://www.w3.org/2000/svg";
      for (let i = 0; i < 60; i++) {
        const angle = (i * 6) * Math.PI / 180;
        const isHour = i % 5 === 0;
        const rOuter = 53;
        const rInner = isHour ? 48 : 50.5;

        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", 60 + rInner * Math.sin(angle));
        line.setAttribute("y1", 60 - rInner * Math.cos(angle));
        line.setAttribute("x2", 60 + rOuter * Math.sin(angle));
        line.setAttribute("y2", 60 - rOuter * Math.cos(angle));
        line.setAttribute("stroke", "#111111");
        line.setAttribute("stroke-width", isHour ? "1.5" : "0.7");
        ticksGroup.appendChild(line);

        if (isHour) {
          const hourNum = i === 0 ? 12 : i / 5;
          const rText = 40;
          const text = document.createElementNS(ns, "text");
          text.setAttribute("x", 60 + rText * Math.sin(angle));
          text.setAttribute("y", 60 - rText * Math.cos(angle) + 3);
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("font-size", "8.5");
          text.setAttribute("font-family", "sans-serif");
          text.setAttribute("fill", "#111111");
          text.textContent = hourNum;
          ticksGroup.appendChild(text);
        }
      }
    }

    // 列車種別の背景色を変更
    function setTrainTypeColor(colorClass) {
      const bgEl = document.getElementById('train-type-bg');
      if (!bgEl) return;
      const baseClass = "col-span-8 flex items-center justify-center py-1 px-2 border-r-2 border-black border-line relative group min-h-[3.5rem]";
      bgEl.className = `${baseClass} ${colorClass}`;
      bgEl.dataset.colorClass = colorClass;
    }

    // 昼夜（ダーク）モード切替
    function toggleDarkMode() {
      document.body.classList.toggle('dark-theme');
      const isDark = document.body.classList.contains('dark-theme');
      showToast(isDark ? "夜間（反転）モードに切り替えました" : "昼間モードに切り替えました");
    }

    // 文字サイズ調整
    function changeFontScale(delta) {
      const nextScale = Math.min(1.4, Math.max(0.75, (currentData.fontScale || 1.0) + delta));
      currentData.fontScale = Math.round(nextScale * 100) / 100;
      document.getElementById('staff-sheet').style.fontSize = `${Math.round(currentData.fontScale * 100)}%`;
      showToast(`文字サイズ: ${Math.round(currentData.fontScale * 100)}%`);
    }

    // 編集画面と表示画面の切り替え
    function switchViewMode(mode, silent = false) {
      if (viewMode === 'edit' && mode === 'view') {
        currentData = collectCurrentData();
      }

      viewMode = mode;
      const appContainer = document.getElementById('app-container');
      const colorPickerBar = document.getElementById('color-picker-bar');
      const menuModeLabel = document.getElementById('menu-mode-label');
      const menuBtnEdit = document.getElementById('menu-btn-edit');
      const menuBtnView = document.getElementById('menu-btn-view');
      const checkEdit = document.getElementById('check-edit');
      const checkView = document.getElementById('check-view');
      const menuEditActions = document.getElementById('menu-edit-actions');

      // 全編集可能要素の contenteditable を切り替え
      const editables = appContainer.querySelectorAll('[contenteditable]');
      editables.forEach(el => {
        el.contentEditable = (mode === 'edit') ? 'true' : 'false';
      });

      if (mode === 'edit') {
        appContainer.classList.add('edit-mode');
        colorPickerBar.classList.remove('hidden');
        menuEditActions.classList.remove('hidden');

        menuBtnEdit.className = "w-full text-left px-3 py-2 rounded-lg font-bold bg-blue-50 text-blue-700 flex items-center justify-between";
        menuBtnView.className = "w-full text-left px-3 py-2 rounded-lg font-medium hover:bg-gray-100 flex items-center justify-between";
        checkEdit.classList.remove('hidden');
        checkView.classList.add('hidden');
        menuModeLabel.textContent = "表示画面（現在時刻）へ切替";

        // 時計を編集データ上の固定時刻に戻す
        setClockMode('fixed');
        document.getElementById('digital-clock').textContent = currentData.clockTime || "00 : 00 : 00";
        syncClockFromText();

        if (!silent) showToast("編集画面に切り替えました");
      } else {
        appContainer.classList.remove('edit-mode');
        colorPickerBar.classList.add('hidden');
        menuEditActions.classList.add('hidden');

        menuBtnView.className = "w-full text-left px-3 py-2 rounded-lg font-bold bg-emerald-50 text-emerald-700 flex items-center justify-between";
        menuBtnEdit.className = "w-full text-left px-3 py-2 rounded-lg font-medium hover:bg-gray-100 flex items-center justify-between";
        checkView.classList.remove('hidden');
        checkEdit.classList.add('hidden');
        menuModeLabel.textContent = "編集画面へ戻る";

        // 表示画面では実際の現在時刻をリアルタイム表示
        setClockMode('realtime');

        if (!silent) showToast("表示画面（現在時刻・編集ロック）に切り替えました");
      }
    }

    // フルスクリーン切り替え
    function toggleFullScreen() {
      const docEl = document.documentElement;
      const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement;

      if (!isFullScreen) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {
            showToast("フルスクリーン表示がブラウザにブロックされました");
          });
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // フルスクリーン状態に応じたUI更新
    function updateFullScreenUI() {
      const isFullScreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      const menuFsLabel = document.getElementById('menu-fs-label');
      const menuFsLabelRight = document.getElementById('menu-fs-label-right');

      if (isFullScreen) {
        document.body.classList.remove('py-4', 'px-2', 'sm:px-4');
        if (menuFsLabel) menuFsLabel.textContent = "フルスクリーン解除";
        if (menuFsLabelRight) menuFsLabelRight.textContent = "フルスクリーン解除";
      } else {
        document.body.classList.add('py-4', 'px-2', 'sm:px-4');
        if (menuFsLabel) menuFsLabel.textContent = "フルスクリーン表示";
        if (menuFsLabelRight) menuFsLabelRight.textContent = "フルスクリーン表示";
      }
    }

    // データを画面全体に反映
    function renderData(data) {
      document.getElementById('nav-back-text').textContent = data.navBackText || "メニュー";
      document.getElementById('depot-name').textContent = data.depotName || "";
      document.getElementById('train-type').textContent = data.trainType || "";
      setTrainTypeColor(data.trainTypeColor || "bg-black text-white");
      document.getElementById('car-type').textContent = data.carType || "";
      document.getElementById('car-count').textContent = data.carCount || "";
      document.getElementById('origin-station').textContent = data.originStation || "";
      document.getElementById('dest-station').textContent = data.destStation || "";
      document.getElementById('train-number').textContent = data.trainNumber || "";
      document.getElementById('duty-status').textContent = data.dutyStatus || "";
      document.getElementById('digital-clock').textContent = data.clockTime || "00 : 00 : 00";
      document.getElementById('remarks-content').textContent = data.remarks || "";
      document.getElementById('side-note-column').textContent = data.sideNote || "";

      // 文字スケール適用
      currentData.fontScale = data.fontScale || 1.0;
      document.getElementById('staff-sheet').style.fontSize = `${Math.round(currentData.fontScale * 100)}%`;

      // 時刻表行の描画
      const container = document.getElementById('timetable-rows');
      container.innerHTML = '';

      data.rows.forEach((row, idx) => {
        const rowEl = document.createElement('div');
        rowEl.className = "grid grid-cols-12 min-h-[2.15rem] border-line items-stretch";
        rowEl.dataset.index = idx;

        // 1. 駅名セル (3カラム)
        const stationCell = document.createElement('div');
        stationCell.contentEditable = "true";
        stationCell.className = "col-span-3 border-r border-black border-line flex items-center justify-center text-base sm:text-lg tracking-wider px-0.5 py-0.5";
        stationCell.textContent = row.station;
        stationCell.dataset.field = "station";

        // 2. 着時刻セル (4カラム)
        const arrCell = createTimeCell(row.arrHm, row.arrSec, row.arrHighlight, "arr");
        arrCell.classList.add("col-span-4", "border-r", "border-black", "border-line");

        // 3. 中央記号セル (1カラム)
        const markCell = document.createElement('div');
        markCell.contentEditable = "true";
        markCell.className = "col-span-1 border-r border-black border-line flex items-center justify-center text-xs sm:text-sm font-bold px-0 py-0.5";
        markCell.textContent = row.mark;
        markCell.dataset.field = "mark";
        markCell.title = "クリックで編集（×など）";

        // 4. 発時刻セル (4カラム)
        const depCell = createTimeCell(row.depHm, row.depSec, row.depHighlight, "dep");
        depCell.classList.add("col-span-4");

        rowEl.appendChild(stationCell);
        rowEl.appendChild(arrCell);
        rowEl.appendChild(markCell);
        rowEl.appendChild(depCell);
        container.appendChild(rowEl);
      });

      syncClockFromText();
    }

    // 時刻セル（時:分 + 上付き秒数）を生成
    function createTimeCell(hm, sec, isHighlight, prefix) {
      const wrapper = document.createElement('div');
      wrapper.className = "flex items-center justify-center px-1 py-0.5 gap-0.5";

      const hmSpan = document.createElement('span');
      hmSpan.contentEditable = "true";
      hmSpan.className = "text-lg sm:text-xl tracking-tight min-w-[2.6rem] text-right";
      hmSpan.textContent = hm;
      hmSpan.dataset.field = `${prefix}Hm`;

      const secSpan = document.createElement('span');
      secSpan.contentEditable = "true";
      secSpan.className = `text-[0.68rem] sm:text-xs leading-none px-1 py-0.5 rounded-[2px] -mt-2 min-w-[1.25rem] text-center font-medium ${
        isHighlight ? 'bg-pink-500 text-black font-bold highlight-badge' : ''
      }`;
      secSpan.textContent = sec;
      secSpan.dataset.field = `${prefix}Sec`;
      secSpan.dataset.highlight = isHighlight ? "true" : "false";
      secSpan.title = "ダブルクリックでピンク色強調のON/OFF";
      // ダブルクリックでピンク色の強調バッジをトグル（編集モード時のみ有効）
      secSpan.addEventListener('dblclick', (e) => {
        if (viewMode !== 'edit') return;
        e.preventDefault();
        const active = secSpan.dataset.highlight === "true";
        if (active) {
          secSpan.dataset.highlight = "false";
          secSpan.classList.remove('bg-pink-500', 'text-black', 'font-bold', 'highlight-badge');
        } else {
          secSpan.dataset.highlight = "true";
          secSpan.classList.add('bg-pink-500', 'text-black', 'font-bold', 'highlight-badge');
        }
      });

      wrapper.appendChild(hmSpan);
      wrapper.appendChild(secSpan);
      return wrapper;
    }

    // 現在のDOM状態からJSONデータを収集
    function collectCurrentData() {
      const rowEls = document.querySelectorAll('#timetable-rows > div');
      const rows = Array.from(rowEls).map(rowEl => {
        const station = rowEl.querySelector('[data-field="station"]').textContent.trim();
        const arrHm = rowEl.querySelector('[data-field="arrHm"]').textContent.trim();
        const arrSecEl = rowEl.querySelector('[data-field="arrSec"]');
        const arrSec = arrSecEl.textContent.trim();
        const arrHighlight = arrSecEl.dataset.highlight === "true";
        const mark = rowEl.querySelector('[data-field="mark"]').textContent.trim();
        const depHm = rowEl.querySelector('[data-field="depHm"]').textContent.trim();
        const depSecEl = rowEl.querySelector('[data-field="depSec"]');
        const depSec = depSecEl.textContent.trim();
        const depHighlight = depSecEl.dataset.highlight === "true";

        return { station, arrHm, arrSec, arrHighlight, mark, depHm, depSec, depHighlight };
      });

      return {
        navBackText: "メニュー",
        depotName: document.getElementById('depot-name').textContent.trim(),
        trainType: document.getElementById('train-type').textContent.trim(),
        trainTypeColor: document.getElementById('train-type-bg').dataset.colorClass || "bg-black text-white",
        carType: document.getElementById('car-type').textContent.trim(),
        carCount: document.getElementById('car-count').textContent.trim(),
        originStation: document.getElementById('origin-station').textContent.trim(),
        destStation: document.getElementById('dest-station').textContent.trim(),
        trainNumber: document.getElementById('train-number').textContent.trim(),
        dutyStatus: document.getElementById('duty-status').textContent.trim(),
        clockTime: document.getElementById('digital-clock').textContent.trim(),
        remarks: document.getElementById('remarks-content').innerText,
        sideNote: document.getElementById('side-note-column').innerText,
        fontScale: currentData.fontScale || 1.0,
        rows
      };
    }

    // JSONファイルとして書き出し
    function exportJSON() {
      const data = (viewMode === 'edit') ? collectCurrentData() : currentData;
      const jsonStr = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const trainNo = (data.trainNumber || "staff").replace(/[^\w\u3040-\u30ff\u4e00-\u9faf]/g, "_");
      const a = document.createElement('a');
      a.href = url;
      a.download = `staff_${trainNo}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("JSONファイルを書き出しました");
    }

    // JSONファイルの読み込み
    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.rows)) {
            throw new Error("無効なデータ形式です");
          }
          currentData = parsed;
          renderData(currentData);
          if (viewMode === 'view') {
            switchViewMode('view', true);
          }
          showToast(`「${file.name}」を読み込みました`);
        } catch (err) {
          showToast("エラー: JSONファイルの読み込みに失敗しました");
          console.error(err);
        }
        event.target.value = "";
      };
      reader.readAsText(file);
    }

    // 時刻表の行を追加
    function addStationRow() {
      const data = collectCurrentData();
      data.rows.push({
        station: "",
        arrHm: "",
        arrSec: "",
        arrHighlight: false,
        mark: "",
        depHm: "",
        depSec: "",
        depHighlight: false
      });
      currentData = data;
      renderData(currentData);
      showToast("時刻表に1行追加しました");
    }

    // 時刻表の末尾行を削除
    function removeStationRow() {
      const data = collectCurrentData();
      if (data.rows.length <= 1) {
        showToast("これ以上行を削除できません");
        return;
      }
      data.rows.pop();
      currentData = data;
      renderData(currentData);
      showToast("一番下の行を削除しました");
    }

    // 初期状態にリセット
    function resetToDefault() {
      currentData = JSON.parse(JSON.stringify(DEFAULT_DATA));
      renderData(currentData);
      switchViewMode('edit', true);
      showToast("すべてクリア（白紙状態）にしました");
    }

    // デジタル時計のテキストからアナログ時計の針を更新
    function syncClockFromText() {
      const text = document.getElementById('digital-clock').textContent.trim();
      const nums = text.match(/\d+/g);
      if (!nums || nums.length < 2) return;

      const h = parseInt(nums[0], 10) || 0;
      const m = parseInt(nums[1], 10) || 0;
      const s = nums[2] ? parseInt(nums[2], 10) : 0;

      updateClockHands(h, m, s);
    }

    // アナログ時計の針の角度を設定
    function updateClockHands(h, m, s) {
      const secDeg = s * 6;
      const minDeg = m * 6 + s * 0.1;
      const hourDeg = (h % 12) * 30 + m * 0.5;

      document.getElementById('second-hand').setAttribute('transform', `rotate(${secDeg} 60 60)`);
      document.getElementById('minute-hand').setAttribute('transform', `rotate(${minDeg} 60 60)`);
      document.getElementById('hour-hand').setAttribute('transform', `rotate(${hourDeg} 60 60)`);
    }

    // 時計モード切替（固定 / リアルタイム）
    function setClockMode(mode) {
      if (clockInterval) {
        clearInterval(clockInterval);
        clockInterval = null;
      }
      if (mode === 'realtime') {
        const tick = () => {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          const ss = String(now.getSeconds()).padStart(2, '0');
          document.getElementById('digital-clock').textContent = `${hh} : ${mm} : ${ss}`;
          updateClockHands(now.getHours(), now.getMinutes(), now.getSeconds());
        };
        tick();
        clockInterval = setInterval(tick, 1000);
      }
    }
    // 編集枠ハイライトのON/OFF（不要になったため削除・整理）
    // トースト通知表示
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }
  </script>
